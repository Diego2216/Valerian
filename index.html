<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101015"><title>VALERIAN</title><style>body{font-family:system-ui;background:#101015;color:#f6f3eb;margin:0;padding:24px}header{font-size:30px;font-weight:800;margin:30px 0}small{color:#c0b9aa}.card{background:#1d1d25;border:1px solid #34343e;border-radius:18px;padding:20px;margin:14px 0}button{background:#e6ad58;color:#16120d;border:0;border-radius:12px;padding:14px 20px;font-weight:700}input{padding:13px;background:#30303a;color:white;border:0;border-radius:10px;width:85%}</style><link rel="manifest" href="./manifest.webmanifest"></head><body><header>VALERIAN <small>V1.1</small></header><p>Seu assistente residencial • demonstração</p><div id="devices"></div><div class="card"><h3>Rotinas</h3><button onclick="routine('noite')">Boa noite</button> <button onclick="routine('cinema')">Cinema</button> <button onclick="routine('cheguei')">Cheguei</button></div><div class="card"><h3>Comando</h3><input id="cmd" placeholder="Ex.: acender sala"><p><button onclick="command()">Executar</button></p><p id="status">Pronto para comandos simulados.</p></div><script>const names=['Sala','Quarto','Cozinha','Escritório'];let state=JSON.parse(localStorage.getItem('valerian-devices')||'[false,false,false,false]');function draw(){document.getElementById('devices').innerHTML=names.map((n,i)=>'<div class="card"><h3>💡 '+n+'</h3><p>'+(state[i]?'Ligada':'Desligada')+'</p><button onclick="toggle('+i+')">'+(state[i]?'Desligar':'Ligar')+'</button></div>').join('');localStorage.setItem('valerian-devices',JSON.stringify(state))}function toggle(i){state[i]=!state[i];draw()}function routine(r){state=r==='noite'?[false,false,false,false]:r==='cinema'?[true,false,false,false]:[true,true,true,true];draw();status.textContent='Rotina '+r+' aplicada (simulação)'}function command(){const t=document.getElementById('cmd').value.toLowerCase();const i=names.findIndex(n=>t.includes(n.toLowerCase()));if(i>=0){state[i]=!/deslig|apag/.test(t);draw();status.textContent='Comando executado (simulação)'}else status.textContent='Diga o nome de um cômodo.'}draw();if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});</script></body></html>
